<!DOCTYPE html>
<html>
    <head>
        <title>IPL Ticket booking Form</title>
        <link rel = "stylesheet" href = "CSS/style.css">
    </head>
    <body>
        <h2>IPL Ticket Booking Form</h2>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <br><br> 

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your Email" required>
            <br><br>

            <label for="phone">Phone number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" 
            minlength="10" maxlength="10" required>
            <br><br>
            
            
            <label for="match">Choose Match</label>
            <select id="match" name="match" required>
                <option value="" disabled selected>-- Select a Match --</option>
                <option value="CSK vs MI">CSK vs MI</option>
                <option value="RCB vs KKR">RCB vs KKR</option>
            </select>
            <br><br>

            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="" disabled selected>-- Select Stand --</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>
            <br><br>
            
            

            <label for="tickets">Number of tickets</label>
            <input type="number" id="tickets" name="tickets" placeholder="Enter number of tickets"
            min="1" max="10" required>
            <br><br>

           

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the booking guidelines</label>
            <br><br>

            <input type="submit" value="Book Ticket"> 
            <input type="reset" value="Reset">




        </form>
    </body>
</html>
